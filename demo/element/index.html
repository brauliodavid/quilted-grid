<!doctype html>
<html>
  <head>
    <script type="module">
      import { register } from 'quilted-grid/element';
      import images from '../dummy.json'
      register(); // defines <quilted-grid>

      function createQuiltImgTile({ src = '', rows = 1, cols = 1} = {}) {
        const t = document.createElement('quilted-tile');
        t.setAttribute('rows', rows);
        t.setAttribute('cols', cols);

        const img = document.createElement('img');
        img.src = src
        t.appendChild(img);

        // t.appendChild(img);
        return t;
      }

      const el = document.querySelector('quilted-grid');
      // el.data = images;
      const tiles = images.map(img => createQuiltImgTile({src: img.src, rows: img.rows, cols: img.cols}))
      tiles.map(t => el.appendTile(t))
      
      el.options = {
        gap: 2
      }

      el.patchOptions({
        onTileClick: ({ tile, index, event }) => {
          console.log('onTileClick callback', index, tile, event.type);
        },
        onTileRemove: ({ index, image }) => {
          console.log('onTileRemove callback', index, image);
        }
      });
    </script>
  </head>
  <body>
    <div style="width: 480px">
